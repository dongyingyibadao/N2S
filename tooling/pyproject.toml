[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "n2s-rules"
version = "0.1.0"
description = "Fail-closed N2S migration rule runner"
requires-python = ">=3.10"
dependencies = [
  "libcst==1.9.0",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
]

[project.scripts]
n2s-rules = "n2s_rules.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
