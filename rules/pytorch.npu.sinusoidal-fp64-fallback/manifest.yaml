schema_version: 1.0.0
id: pytorch.npu.sinusoidal-fp64-fallback
version: 0.2.0
title: NPU sinusoidal FP64 capability fallback
status: candidate
summary: Use FP32 only at a recognized sinusoidal safe-dtype boundary when NPU FP64 is unsuitable.
classification: numerical_precision
risk: medium
scope:
  ecosystem: pytorch-torch-npu
  frameworks: ["PyTorch >=2.1", "torch-npu (version-specific validation required)"]
  devices: ["Ascend NPU"]
  modes: [training, inference]
  code_shapes:
    - A local get_safe_dtype(target_dtype, device_type) helper maps MPS float64 requests to torch.float32 and is called by a sinusoidal function.
    - LeRobot src/lerobot/utils/device_utils.py has the recognized shared get_safe_dtype(dtype, device) MPS guard and device normalization.
    - OpenPI src/openpi/models_pytorch/pi0_pytorch.py has the recognized CPU-safe helper and local sinusoidal float64 call but no NPU guard.
source_cases:
  - cases/MINT:sinusoidal-fp64-to-fp32-on-npu
  - cases/validation-projects:lerobot-4aaff99-shared-safe-dtype-static
  - cases/validation-projects:openpi-215abfb-local-safe-dtype-static
applicability:
  preconditions:
    - The matched helper is used by sinusoidal or positional embedding construction.
    - CPU float64 remains available as the numerical reference.
    - The target NPU operation has been shown not to require true FP64 semantics.
  exclusions:
    - Arbitrary model parameters, reductions, optimizers, losses, or scientific FP64 code.
    - Helpers whose device argument is not a canonical torch device type string.
  unknowns_fail_closed: true
contract:
  before:
    - get_safe_dtype contains one of the three exact fail-closed shapes recognized by detector.py.
  after:
    - An existing MPS fallback is extended to mps and npu, or the recognized OpenPI-local helper receives one NPU float64 fallback.
  invariants:
    - CPU float64 behavior is unchanged.
    - Requested non-float64 dtypes are unchanged.
    - No project code imports N2S.
change:
  rationale: A narrow FP32 alternative can avoid an expensive FP64 sinusoidal path, but current evidence does not show FP64 is unsupported on the tested NPU.
  method: Extend a recognized MPS safe-dtype guard, or insert an equivalent NPU-only guard in the fixed OpenPI-local shape.
  before_example: 'if device_type == "mps" and target_dtype == torch.float64:'
  after_example: 'if device_type in {"mps", "npu"} and target_dtype == torch.float64:'
impact:
  functional: The recognized NPU positional embedding path executes in FP32 instead of FP64.
  numerical: The 256-dimension case recorded max_abs_error 1.1957985683264116e-4; a wider 1024-dimension range recorded 1.0269512865533403e-2, so no common threshold is justified.
  performance: The 4096x1024 NPU operator workload recorded an FP32/FP64 median ratio of 0.002539284572777645; this is one workload, not a global speed claim.
  memory: The same operator workload recorded 41947136 fewer peak incremental bytes for FP32; model-level live-path memory evidence is unavailable.
  benefits:
    - May reduce time and peak memory for explicitly approved sinusoidal shapes where FP32 error is acceptable.
  drawbacks:
    - Changes rounding relative to CPU FP64.
  side_effects:
    - None outside callers of the matched safe-dtype helper; downstream tensors may remain FP32.
automation:
  detector: detector.py
  codemod: codemod.py
  validator: validator.py
  language: python-libcst-1.9.0
  auto_apply: false
  fail_closed: true
verification:
  acceptance_contract:
    functional: Fixed supported-shape embedding cases execute on target NPU and match expected shape/dtype; approved shapes are pending.
    numerical: Per-shape max_abs_error, RMSE and cosine thresholds against CPU FP64 are pending cross-project evidence and approval.
    performance: Record raw samples, median and p95 on the same NPU; no regression limit is approved yet.
    memory: Record peak allocated memory on the same NPU; no regression limit is approved yet.
  commands: []
evidence:
  - evidence/summary.yaml
promotion:
  requirements:
    - MINT plus two independent non-MINT projects across at least two model families.
    - Fixed checkpoint/input/seed model-level action or logit, top-k, loss and gradient comparison.
    - CPU FP64 or original CUDA reference and same-NPU before/after timing and memory.
    - Explicit approved thresholds for each declared dimension and period range.
  blockers:
    - CUDA comparison is pending.
    - Current torch 2.9.0 plus torch-npu 2.9.0 passed every tested FP64 shape, so a universal capability-fallback rationale is unsupported.
    - LeRobot and OpenPI passed static adapter validation only; runtime/model evidence is pending.
    - The fixed MINT model does not call the matched sinusoidal helper, making its zero full-model delta vacuous.
    - Target-project verification commands have not been approved.
rollback: Restore the MPS-only equality check, or remove the OpenPI-local NPU guard, then rerun the verified FP64 path.
approval: null
